services:
  - type: web
    name: grameen-udyog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: MONGO_URL
        sync: false          # paste your MongoDB Atlas connection string in the Render dashboard
      - key: DB_NAME
        value: grameen_udyog
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate a strong secret
      - key: NODE_VERSION
        value: 20.11.1
